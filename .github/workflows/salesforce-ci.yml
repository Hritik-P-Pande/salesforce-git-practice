name: Salesforce CI

on:
  push:
    branches:
      - main

jobs:
  salesforce-check:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Check Salesforce CLI
        run: sf --version